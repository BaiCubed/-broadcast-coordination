version: 1
results_root: results/supp_smoke
primary_dataset: smart_grid_smart_city
primary_config: results/smart_grid_smart_city_ieee33_real_load/config/default_weak_correlation.yaml
random_seed: 20260720
pilot: false
common:
  train_replications: 10
  test_replications: 100
  conditions: 48
  bootstrap_samples: 1000
  nrmse_limit: 0.1
  blocked_fraction_limit: 0.05
  sign_consistency_limit: 0.95
  controllable_probability: 0.9
  step_minutes: 5.0
execution:
  experiments:
  - E13
  - E14
  dataset_workers: 1
  wait_for_pid: null
  minimum_available_memory_gb: 4.0
e13:
  datasets: &id001
  - bdg1_building_data_genome
  n_candidates: &id002
  - 50
  - 100
  - 150
  include_maximum_unique_fleet: true
  logics:
  - open_loop
  - soc_threshold
  - probabilistic
  - price_response
  - random_delay
  - hybrid
  conditions: 8
  train_replications: 3
  test_replications: 8
  broadcast_basis_columns: 9
  initial_soc_low: 0.12
  initial_soc_high: 0.93
e14:
  datasets: *id001
  n_candidates: *id002
  include_maximum_unique_fleet: true
  injections:
  - count: 0
    ratio: 1.0
  - count: 1
    ratio: 10.0
  - count: 1
    ratio: 100.0
  - count: 1
    ratio: 1000.0
  conditions: 8
  train_replications: 3
  test_replications: 8
  broadcast_basis_columns: 9
