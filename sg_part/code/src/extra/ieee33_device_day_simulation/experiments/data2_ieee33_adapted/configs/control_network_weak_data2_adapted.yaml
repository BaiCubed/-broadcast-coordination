signal_mode: real_net_balance
eps_mode: original_simulator_signal
network_coordination: proportional_post_dispatch
network_feedback: true
enforce_feeder_capacity: true
enforce_voltage_limits: true
enforce_transformer_limit: true
enforce_spatial_concentration: true
charge_signal_threshold: 8
voltage_sensitivity: 0.00005
reverse_flow_sensitivity: 0.00020
# Fleet-scale calibration for 3,000 data2 transaction resources. The IEEE33
# constraints remain active, but their configured ratings match the aggregate
# MW-scale input instead of a single-device kW-scale case.
network_capacity_multiplier: 128.0
