version: 1
results_root: results/nc_excel_experiments_new
primary_dataset: smart_grid_smart_city
primary_config: results/smart_grid_smart_city_ieee33_real_load/config/default_weak_correlation.yaml
random_seed: 20260720
pilot: false
common:
  train_replications: 10
  test_replications: 100
  conditions: 48
  bootstrap_samples: 1000
  nrmse_limit: 0.10
  blocked_fraction_limit: 0.05
  sign_consistency_limit: 0.95
  controllable_probability: 0.90
  step_minutes: 5.0
e1:
  datasets:
    - bdg1_building_data_genome
    - low_carbon_london
    - bdg2_building_data_genome
    - danish_smart_heat_meters
    - smart_grid_smart_city
    - heapo_heat_pumps
    - goiener_smart_meters
    - european_lv_urban_8087
    - european_lv_rural_2731
    - european_lv_urban_35297
    - norway_ami_energy_distribution
    - camsl_japan_smart_meters
    - irish_domestic_smart_meters
    - opsd_household_data
    - complete_energy_community
  # 相关性不再由 zone_correlation 注入。旧设计的 rho 分布与数据集无关，
  # 14 个数据集测出来一致到 3.6e-8，iid 下 N_eff/N 恒为 1.000，
  # 15 个数据集在 E1 里退化成了"能跑到多大的 N"。现在耦合直接来自每个数据集
  # 自己的真实功率残差（见 coupling.py），没有 rho 旋钮，也没有幅度参数。
  #
  # 条件数从 6 降到 2（data_coupled + decoupled 对照），省下的预算换成更密的 N 网格：
  # N* 是要报进论文的量，原来 6 个点定不准。总成本仍低于旧配置的 60%。
  n_candidates: [1, 5, 15, 30, 50, 100, 150, 250, 400, 650, 1000, 1600, 2000, 2500, 3000]
  include_maximum_unique_fleet: true
  train_replications: 10
  # The pre-registered rule is LCB95[p_ctrl] >= 0.90. At 40 replications only a
  # perfect 40/40 clears that bound, so N* would flip on one unlucky seed; 120
  # makes the boundary estimable (p_hat ~ 0.945 already clears it).
  test_replications: 120
  conditions: 48
  # trace_features 的前 9 列是广播信号本身（常数/强度/方向/三段样条铰链）。
  # 第 10 列起是 load、变压器负载率、电压裕度这些电网状态 —— 那正是共同环境驱动，
  # 一起回归掉就把要测的协动测没了，所以 N_eff 的残差只对前 9 列回归。
  broadcast_basis_columns: 9
e2:
  datasets:
    - bdg1_building_data_genome
    - low_carbon_london
    - bdg2_building_data_genome
    - danish_smart_heat_meters
    - smart_grid_smart_city
    - heapo_heat_pumps
    - goiener_smart_meters
    - european_lv_urban_8087
    - european_lv_rural_2731
    - european_lv_urban_35297
    - norway_ami_energy_distribution
    - camsl_japan_smart_meters
    - irish_domestic_smart_meters
    - opsd_household_data
    - complete_energy_community
  common_resources: 6
  include_maximum_unique_fleet: true
  homogeneity: [0.0, 0.25, 0.5, 0.75, 0.9, 1.0]
  broadcast_modes: [step, periodic, ramp, rapid_changing]
  delay_distributions: [fixed, uniform, lognormal]
  steps: 48
  train_replications: 10
  test_replications: 24
  direction_concentration_limit: 0.90
  sync_excess_limit: 0.001
  surrogate_z99: 2.326347874
e3:
  datasets:
    - bdg1_building_data_genome
    - low_carbon_london
    - bdg2_building_data_genome
    - danish_smart_heat_meters
    - smart_grid_smart_city
    - heapo_heat_pumps
    - goiener_smart_meters
    - european_lv_urban_8087
    - european_lv_rural_2731
    - european_lv_urban_35297
    - norway_ami_energy_distribution
    - camsl_japan_smart_meters
    - irish_domestic_smart_meters
    - opsd_household_data
    - complete_energy_community
  # Cycle lengths in simulation steps at 5 min per step: 15, 30, 60 and 120 min.
  period_steps: [3, 6, 12, 24]
  # The workbook also lists a 5 min broadcast period. One simulation step cannot
  # carry a phase, so it is reported as excluded rather than silently analysed.
  excluded_period_minutes: [5]
  duty_cycles: [0.25, 0.5, 0.75]
  delay_distributions: [fixed, uniform, lognormal]
  homogeneity: [0.0, 0.9]
  resources: [200, 600, 1200]
  primary:
    period_steps: 12
    duty: 0.5
    delay_distribution: lognormal
    resources: 1200
  replications: 8
  transient_periods: 4
  minimum_cycles: 24
  surrogates: 100
  surrogate_method: both
  surrogate_quantile: 0.99
  plv_pairs: 20000
e4:
  datasets:
    - bdg1_building_data_genome
    - low_carbon_london
    - bdg2_building_data_genome
    - danish_smart_heat_meters
    - smart_grid_smart_city
    - heapo_heat_pumps
    - goiener_smart_meters
    - european_lv_urban_8087
    - european_lv_rural_2731
    - european_lv_urban_35297
    - norway_ami_energy_distribution
    - camsl_japan_smart_meters
    - irish_domestic_smart_meters
    - opsd_household_data
    - complete_energy_community
  resources: 1200
  conditions: 48
  # Each condition is held for settle_steps and read over the last measure_steps
  # so a controller response delay cannot leak into the next condition's sample.
  settle_steps: 8
  measure_steps: 3
  delay_distribution: fixed
  drift_delay_shift: 3
  window_samples: 50
  detection_consecutive_windows: 2
  recalibration_interval_windows: 1
  recalibration_samples: 400
  ridge: 0.000001
  recovery_tolerance: 0.01
  recovery_level: 0.90
  unknown_fractions: [0.2, 0.5, 0.8]
  drift_modes: [abrupt, gradual]
  gradual_ramp_replications: 20
  train_replications: 60
  validation_replications: 40
  test_replications: 90
  holdout_replications: 40
  injection_replication: 30
  seeds: 8
e6:
  datasets:
    - bdg1_building_data_genome
    - low_carbon_london
    - bdg2_building_data_genome
    - danish_smart_heat_meters
    - smart_grid_smart_city
    - heapo_heat_pumps
    - goiener_smart_meters
    - european_lv_urban_8087
    - european_lv_rural_2731
    - european_lv_urban_35297
    - norway_ami_energy_distribution
    - camsl_japan_smart_meters
    - irish_domestic_smart_meters
    - opsd_household_data
    - complete_energy_community
  resources: 3000
  participation: [0.3, 0.5, 0.7, 0.9, 1.0]
  structures: [iid, markov, community]
  markov_persistence: 0.90
  community_shared_fraction: 0.50
e7:
  datasets:
    - bdg1_building_data_genome
    - low_carbon_london
    - bdg2_building_data_genome
    - danish_smart_heat_meters
    - smart_grid_smart_city
    - heapo_heat_pumps
    - goiener_smart_meters
    - european_lv_urban_8087
    - european_lv_rural_2731
    - european_lv_urban_35297
    - norway_ami_energy_distribution
    - camsl_japan_smart_meters
    - irish_domestic_smart_meters
    - opsd_household_data
    - complete_energy_community
  n_candidates: [50, 100, 200, 500, 1000, 2000, 3000]
  include_maximum_unique_fleet: true
  replications: 110
  conditions: 24
  directions: [charge, discharge]
e10:
  datasets:
    - bdg1_building_data_genome
    - low_carbon_london
    - bdg2_building_data_genome
    - danish_smart_heat_meters
    - smart_grid_smart_city
    - heapo_heat_pumps
    - goiener_smart_meters
    - european_lv_urban_8087
    - european_lv_rural_2731
    - european_lv_urban_35297
    - norway_ami_energy_distribution
    - camsl_japan_smart_meters
    - irish_domestic_smart_meters
    - opsd_household_data
    - complete_energy_community
  resources: 3000
  replications: 8
  steps: 288
  layouts: [balanced, feeder_concentrated, end_bus_concentrated]
  controls: [global, zonal]
  modes: [weak_correlation, network_stress]
  feeder_concentration: 0.80
e12:
  expected_figures:
    - fig2_scaling_predictability.png
    - fig3_scaling_heterogeneity.png
    - fig4_robustness_generalization.png
    - fig4_self_consumption.png
    - fig5_correlation_effects.png
  modes: [network_stress, weak_correlation]
execution:
  experiments: [E1, E2, E3, E4]
  dataset_workers: 12
  wait_for_pid: null
  minimum_available_memory_gb: 4.0
