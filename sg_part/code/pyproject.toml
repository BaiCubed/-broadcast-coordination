[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "broadcast-coordination-reproduction"
version = "0.1.0"
description = "Reproduction code and derived data for broadcast coordination experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.21.0",
  "scipy>=1.7.0",
  "scikit-learn>=1.2.0",
  "matplotlib>=3.5.0",
  "pandas>=1.3.0",
  "torch>=2.0.0",
  "PyYAML>=6.0",
  "duckdb>=1.0.0",
  "Pillow>=9.0.0",
  "python-docx>=0.8.11",
  "python-pptx>=0.6.21",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "experiments*"]
